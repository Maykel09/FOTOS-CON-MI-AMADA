<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Galería 3D — Movimiento Realista Multiplataforma</title>
  <style>
    html,body {
      margin:0; padding:0; height:100%; overflow:hidden;
      background:#000; color:#fff; font-family:sans-serif;
      touch-action:none;
    }
    .viewport {
      position:relative; width:100%; height:100%; perspective:1000px; overflow:hidden;
    }
    .scene {
      position:absolute; width:100%; height:100%;
      transform-style:preserve-3d;
      transform:translate3d(0,0,0) rotateX(0deg) rotateY(0deg);
    }
    .floor {
      position:absolute; bottom:-500px; left:50%; transform:translateX(-50%) rotateX(90deg);
      width:5000px; height:5000px;
      background:repeating-linear-gradient(0deg,#333 0 40px,#222 40px 80px);
    }
    .panel {
      position:absolute; width:400px; height:250px; background:#111; border:4px solid #fff;
      box-shadow:0 0 20px rgba(255,255,255,0.3);
    }
    .panel img {width:100%; height:100%; object-fit:cover; display:block;}

    /* Joysticks y botones (solo móvil) */
    .joystick-container {
      position:fixed; bottom:50px; width:120px; height:120px;
      border-radius:50%; background:rgba(255,255,255,0.1);
      border:2px solid rgba(255,255,255,0.3);
      touch-action:none; display:none;
    }
    #joystickMove { left:50px; }
    #joystickLook { right:50px; }
    .joystick-thumb {
      position:absolute; left:50%; top:50%; width:60px; height:60px;
      border-radius:50%; background:rgba(255,255,255,0.3);
      transform:translate(-50%,-50%);
    }
    .button-container {
      position:fixed; bottom:60px; right:200px; display:none; flex-direction:column; gap:20px;
    }
    .action-btn {
      width:80px; height:80px; border-radius:50%; border:none; font-size:18px; color:#fff;
      background:rgba(0,128,255,0.4); box-shadow:0 0 15px rgba(0,128,255,0.6);
      transition:background 0.2s;
    }
    .action-btn:active { background:rgba(0,128,255,0.8); }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="scene" id="scene"></div>
    <div class="floor"></div>
  </div>

  <!-- Joysticks y botones -->
  <div class="joystick-container" id="joystickMove"><div class="joystick-thumb" id="thumbMove"></div></div>
  <div class="joystick-container" id="joystickLook"><div class="joystick-thumb" id="thumbLook"></div></div>
  <div class="button-container" id="buttons">
    <button class="action-btn" id="btnJump">⬆️</button>
    <button class="action-btn" id="btnRun">🏃‍♂️</button>
  </div>

  <script>
    /* ======= Escena ======= */
    const scene = document.getElementById('scene');
    const images = [
      'https://source.unsplash.com/800x600?art1',
      'https://source.unsplash.com/800x600?art2',
      'https://source.unsplash.com/800x600?art3',
      'https://source.unsplash.com/800x600?art4',
      'https://source.unsplash.com/800x600?art5',
      'https://source.unsplash.com/800x600?art6'
    ];
    const spacing = 800;
    images.forEach((src,i)=>{
      const left=document.createElement('div');
      left.className='panel';
      left.style.transform=`translate3d(-500px,0,${-i*spacing}px)`;
      left.innerHTML=`<img src="${src}"/>`;
      scene.appendChild(left);

      const right=document.createElement('div');
      right.className='panel';
      right.style.transform=`translate3d(500px,0,${-i*spacing}px)`;
      right.innerHTML=`<img src="${src}"/>`;
      scene.appendChild(right);
    });

    /* ======= Variables ======= */
    let pos={x:0,y:0,z:0,rotY:0,rotX:0};
    let speed=10, running=false, jumping=false, jumpHeight=0;

    function update(){
      scene.style.transform=
        `translate3d(${-pos.x}px,${-pos.y-jumpHeight}px,${-pos.z}px)
         rotateX(${pos.rotX}deg) rotateY(${pos.rotY}deg)`;
    }

    /* ======= Control por teclado ======= */
    const keys={};
    window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
    window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

    /* ======= Cámara con ratón ======= */
    let dragging=false,lastX=0,lastY=0;
    window.addEventListener('mousedown',e=>{dragging=true; lastX=e.clientX; lastY=e.clientY;});
    window.addEventListener('mouseup',()=>dragging=false);
    window.addEventListener('mousemove',e=>{
      if(dragging){
        const dx=e.clientX-lastX;
        const dy=e.clientY-lastY;
        pos.rotY -= dx*0.3;
        pos.rotX -= dy*0.2;
        pos.rotX = Math.max(-60,Math.min(60,pos.rotX));
        lastX=e.clientX; lastY=e.clientY;
        update();
      }
    });

    /* ======= Joysticks (solo móviles) ======= */
    const joystickMove=document.getElementById('joystickMove');
    const joystickLook=document.getElementById('joystickLook');
    const buttons=document.getElementById('buttons');
    if ('ontouchstart' in window){
      joystickMove.style.display='block';
      joystickLook.style.display='block';
      buttons.style.display='flex';
    }

    function setupJoystick(containerId, thumbId){
      const container=document.getElementById(containerId);
      const thumb=document.getElementById(thumbId);
      let active=false, dx=0, dy=0;
      function reset(){active=false; dx=0; dy=0; thumb.style.transform='translate(-50%,-50%)';}
      container.addEventListener('touchstart',()=>active=true);
      container.addEventListener('touchmove',e=>{
        if(!active)return;
        const rect=container.getBoundingClientRect();
        const t=e.touches[0];
        const offX=t.clientX-(rect.left+rect.width/2);
        const offY=t.clientY-(rect.top+rect.height/2);
        const dist=Math.min(40,Math.sqrt(offX*offX+offY*offY));
        const ang=Math.atan2(offY,offX);
        dx=Math.cos(ang)*(dist/40);
        dy=Math.sin(ang)*(dist/40);
        thumb.style.transform=`translate(${dx*40-50}%,${dy*40-50}%)`;
      });
      container.addEventListener('touchend',reset);
      return ()=>({x:dx,y:dy});
    }

    const getMove=setupJoystick('joystickMove','thumbMove');
    const getLook=setupJoystick('joystickLook','thumbLook');

    const btnJump=document.getElementById('btnJump');
    const btnRun=document.getElementById('btnRun');

    if(btnRun){
      btnRun.addEventListener('touchstart',()=>{running=true;});
      btnRun.addEventListener('touchend',()=>{running=false;});
    }
    if(btnJump){
      btnJump.addEventListener('touchstart',()=>jump());
    }

    /* ======= Lógica de salto ======= */
    function jump(){
      if(jumping) return;
      jumping=true;
      let up=true;
      const interval=setInterval(()=>{
        if(up){ jumpHeight+=15; if(jumpHeight>=150) up=false; }
        else { jumpHeight-=15; if(jumpHeight<=0){jumpHeight=0;jumping=false;clearInterval(interval);} }
        update();
      },30);
    }

    /* ======= Bucle principal ======= */
    function loop(){
      requestAnimationFrame(loop);

      const move=getMove();
      const look=getLook();

      // Mirar con joystick derecho
      pos.rotY -= look.x*3;
      pos.rotX -= look.y*2;
      pos.rotX=Math.max(-60,Math.min(60,pos.rotX));

      // Movimiento con teclado
      const moveForward = (keys['s']?1:0) - (keys['w']?1:0);
      const moveSide = (keys['d']?1:0) - (keys['a']?1:0);
      running = keys['shift'] || running;
      if(keys[' ']) jump();

      // Movimiento total (dirección cámara)
      const angle = pos.rotY * Math.PI/180;
      const forwardX = Math.sin(angle);
      const forwardZ = Math.cos(angle);
      const rightX = Math.cos(angle);
      const rightZ = -Math.sin(angle);

      const spd = running ? 25 : 10;

      pos.x += (moveSide*rightX + moveForward*forwardX)*spd;
      pos.z += (moveSide*rightZ + moveForward*forwardZ)*spd;

      // Movimiento joystick (también relativo a cámara)
      pos.x += ((move.x*rightX) + (-move.y*forwardX))*spd;
      pos.z += ((move.x*rightZ) + (-move.y*forwardZ))*spd;

      update();
    }
    loop();
  </script>
</body>
</html>
